<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B3A2D">
<title>Scanner Kartu Koperasi</title>
<!--
  Halaman scanner QR untuk aplikasi Koperasi Asrama.
  Taruh file ini di GitHub Pages, lalu isi alamatnya di menu Pengaturan > Scanner QR.
  Aplikasi membuka halaman ini di jendela baru. Setelah QR terbaca, kodenya dikirim
  kembali ke aplikasi (window.opener.postMessage) dan jendela ini menutup sendiri.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0B3A2D;--bar:#092F25;--hijau:#0E4D3F;--merah:#B8422F;--emas:#F5D37A}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:#fff;font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
  main{max-width:560px;margin:0 auto;padding:16px 16px 104px}

  /* area kamera */
  #pemindai{position:relative;width:100%;aspect-ratio:2/1;max-height:60vh;background:#000;border-radius:16px;overflow:hidden}
  #reader{position:absolute;inset:0}
  #reader video{width:100%!important;height:100%!important;object-fit:cover}
  #reader img{display:none}
  #bingkai{position:absolute;left:50%;top:50%;width:46%;aspect-ratio:1/1;max-height:80%;transform:translate(-50%,-50%);border:3px solid rgba(245,211,122,.85);border-radius:14px;pointer-events:none;opacity:0;transition:opacity .2s}
  #pemindai.aktif #bingkai{opacity:1}

  /* kartu status */
  #kartu{margin-top:12px;padding:16px;border-radius:16px;background:rgba(255,255,255,.1)}
  #kartu.err{background:var(--merah)}
  #kartu.ok{background:#1F7A5C}
  #kJudul{margin:0;font-size:20px;font-weight:700;line-height:1.3}
  #kTeks{margin:4px 0 0;font-size:15px;word-break:break-word}
  #kKode{display:none;margin:8px 0 0;font-size:20px;font-weight:700;word-break:break-all;color:var(--emas)}

  /* bilah tombol bawah */
  nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:14px;background:var(--bar)}
  button{font:inherit;font-weight:600;min-height:44px;padding:10px 18px;border-radius:10px;cursor:pointer}
  button:focus-visible{outline:3px solid var(--emas);outline-offset:2px}
  .garis{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.4)}
  .garis:hover{background:rgba(255,255,255,.08)}
  .putih{background:#fff;color:var(--hijau);border:1px solid #fff}
  .putih:hover{background:#E4EFE8}
  #btnSalin{display:none}
</style>
</head>
<body>
<main>
  <div id="pemindai"><div id="reader"></div><div id="bingkai"></div></div>
  <div id="kartu" role="status" aria-live="polite">
    <p id="kJudul">Membuka kamera</p>
    <p id="kTeks">Mohon tunggu sebentar.</p>
    <p id="kKode"></p>
  </div>
</main>
<nav>
  <button id="btnGanti" class="garis" type="button">Ganti kamera</button>
  <button id="btnSalin" class="garis" type="button">Salin kode</button>
  <button id="btnUlang" class="putih" type="button">Mulai ulang</button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
(function(){
  var el=function(id){return document.getElementById(id);};
  var scanner=null, terkirim=false, hadap='environment', kamera=[], urut=-1, giliran=0;

  function kartu(jenis,judul,teks,kode){
    el('kartu').className=jenis||'';
    el('kJudul').textContent=judul;
    el('kTeks').textContent=teks||'';
    el('kKode').textContent=kode||'';
    el('kKode').style.display=kode?'block':'none';
    el('btnSalin').style.display=kode?'inline-block':'none';
  }

  function pesanGalat(err){
    var nama=(err&&(err.name||err))||'';
    var teks=String((err&&err.message)||err||'');
    if(/NotAllowed|Permission|denied/i.test(nama+' '+teks))
      return ['Kamera tidak bisa dibuka','Izinkan akses kamera pada browser lalu tekan Mulai ulang.'];
    if(/NotFound|Devices?NotFound|no camera/i.test(nama+' '+teks))
      return ['Kamera tidak ditemukan','Perangkat ini tidak punya kamera yang bisa dipakai. Gunakan scanner USB atau ketik NIS di aplikasi.'];
    if(/NotReadable|TrackStart|in use/i.test(nama+' '+teks))
      return ['Kamera sedang dipakai','Tutup aplikasi lain yang memakai kamera, lalu tekan Mulai ulang.'];
    return ['Kamera tidak bisa dibuka','Izinkan akses kamera pada browser lalu tekan Mulai ulang.'];
  }

  function selesai(kode){
    if(terkirim)return;
    terkirim=true;
    if(navigator.vibrate)navigator.vibrate(120);
    berhenti();
    if(window.opener&&!window.opener.closed){
      // aplikasi memeriksa asal pesan; isi pesan hanya kode yang terbaca
      window.opener.postMessage({type:'koperasi-scan',code:kode},'*');
      kartu('ok','Terkirim ke aplikasi','Jendela ini akan menutup sendiri.');
      setTimeout(function(){window.close();},400);
    }else{
      // dibuka langsung (bukan dari aplikasi): tampilkan kodenya
      kartu('ok','Kode terbaca','Tekan Salin kode, atau Mulai ulang untuk memindai lagi.',kode);
    }
  }

  function berhenti(){
    el('pemindai').className='';
    if(!scanner)return Promise.resolve();
    var s=scanner; scanner=null;
    return s.stop().then(function(){s.clear();}).catch(function(){});
  }

  function mulai(){
    terkirim=false;
    kartu('','Membuka kamera','Mohon tunggu sebentar.');
    berhenti().then(function(){
      if(typeof Html5Qrcode==='undefined'){
        kartu('err','Pemindai gagal dimuat','Periksa koneksi internet lalu tekan Mulai ulang.');
        return;
      }
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
        kartu('err','Kamera tidak tersedia','Buka halaman ini lewat alamat yang diawali https, bukan file lokal.');
        return;
      }
      var sumber=(urut>=0&&kamera[urut])?{deviceId:{exact:kamera[urut].id}}:{facingMode:hadap};
      scanner=new Html5Qrcode('reader');
      scanner.start(sumber,{fps:10},function(teks){selesai(String(teks).trim());},function(){})
        .then(function(){
          el('pemindai').className='aktif';
          kartu('','Arahkan kamera ke QR','Letakkan QR pada kartu santri di depan kamera.');
          // daftar kamera baru tersedia setelah izin diberikan
          Html5Qrcode.getCameras().then(function(d){kamera=d||[];}).catch(function(){});
        })
        .catch(function(err){
          scanner=null;
          var p=pesanGalat(err);
          kartu('err',p[0],p[1]);
        });
    });
  }

  function gantiKamera(){
    if(kamera.length>=2){ urut=(urut<0?0:urut)+1; if(urut>=kamera.length)urut=0; }
    else { urut=-1; hadap=(hadap==='environment')?'user':'environment'; }
    giliran++;
    mulai();
  }

  el('btnUlang').onclick=mulai;
  el('btnGanti').onclick=gantiKamera;
  el('btnSalin').onclick=function(){
    var t=el('kKode').textContent;
    if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){kartu('ok','Kode disalin',t?'Tempel di kolom pencarian aplikasi.':'',t);});
  };
  window.addEventListener('pagehide',berhenti);
  mulai();
})();
</script>
</body>
</html>
